<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, responsive to-do list built with HTML, CSS, JavaScript, and Bootstrap." />
    <title>To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container py-4 py-md-5">
      <section class="app-card mx-auto" aria-labelledby="app-title">
        <div class="app-header">
          <p class="eyebrow mb-2">Stay organized</p>
          <h1 id="app-title" class="display-6 fw-bold mb-2">My To-Do List</h1>
          <p class="text-secondary mb-0">Capture your tasks and make progress one step at a time.</p>
        </div>

        <form id="task-form" class="input-group mt-4" novalidate>
          <label class="visually-hidden" for="task-input">Add a task</label>
          <input id="task-input" class="form-control form-control-lg" type="text" maxlength="120" placeholder="What needs to be done?" autocomplete="off" required />
          <button class="btn btn-primary px-4" type="submit">Add task</button>
        </form>

        <div class="toolbar d-flex flex-wrap justify-content-between align-items-center gap-3 mt-4">
          <div class="btn-group" role="group" aria-label="Filter tasks">
            <button class="btn btn-sm filter-btn active" data-filter="all" type="button">All</button>
            <button class="btn btn-sm filter-btn" data-filter="active" type="button">Active</button>
            <button class="btn btn-sm filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
          <button id="clear-completed" class="btn btn-sm btn-link text-decoration-none px-0" type="button">Clear completed</button>
        </div>

        <ul id="task-list" class="list-group task-list mt-3" aria-live="polite"></ul>
        <div id="empty-state" class="empty-state text-center py-5">
          <div class="empty-icon mb-3" aria-hidden="true">✓</div>
          <h2 class="h5">No tasks here</h2>
          <p class="text-secondary mb-0">Add a task above to get started.</p>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 small text-secondary">
          <span id="task-count">0 tasks left</span>
          <span>Saved automatically</span>
        </div>
      </section>
      <footer class="app-footer text-center text-secondary small mt-4">Built with Bootstrap 5 and vanilla JavaScript</footer>
    </main>

    <noscript><div class="alert alert-warning rounded-0 mb-0 text-center">Please enable JavaScript to use the to-do list.</div></noscript>
    <script src="script.js"></script>
  </body>
</html>
